[project]
name = "network-defender"
version = "0.1.0"
description = "A production-quality, modular Network Intrusion Detection System (IDS) in Python."
authors = [
    { name = "Network Defender Contributors" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scapy>=2.5.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7.4",
    "pyyaml>=6.0.1",
    "watchdog>=6.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "alembic>=1.13.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2.2",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.8",
    "mypy>=1.10.0",
    "respx>=0.21.1",
    "types-PyYAML>=6.0.12",
    "mutmut>=3.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "D"]
# D212 wants the summary on the same line as the opening quotes; this project
# puts it on the next line (D213) and has done since the first module. One of
# the pair has to be off, and changing 300 files to satisfy a linter default
# is not a quality improvement.
ignore = ["D212"]
extend-select = ["D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# A test's name is its documentation — `test_syn_ack_replies_are_not_a_syn_scan`
# says more than a docstring restating it would, and docs/TESTING.md makes that
# the convention. Module docstrings are still required: they are where a suite
# says what it is responsible for proving.
"tests/**" = ["D101", "D102", "D103", "D107"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
# Checked together and by default, so `uv run mypy` with no arguments covers
# everything. Naming paths on the command line is how migrations/ and tests/
# stayed unchecked while `mypy src` reported success.
files = ["src", "tests", "scripts", "migrations"]
# A bare `# type: ignore` hides every error on its line, including ones added
# later. Requiring the code keeps a suppression to the one problem it was
# written for.
enable_error_code = ["ignore-without-code"]

# Scapy only began shipping type information in 2.6. Pinning a floor high
# enough to rely on it would drop the distro-packaged 2.5 that most sensor
# hosts already have, so the import is treated as untyped either way and the
# boundary is re-typed by hand in parser/ and capture/.
[[tool.mypy.overrides]]
module = ["scapy.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
# Reports are written on every run, not just in CI: a developer who wants the
# HTML view should not have to remember a flag, and CI should not need its own
# invocation that differs from the one people run locally.
addopts = """
    --cov=src/network_defender
    --cov-report=term-missing
    --cov-report=xml:reports/coverage.xml
    --cov-report=html:reports/htmlcov
    --junitxml=reports/junit.xml
"""
testpaths = ["tests"]
markers = [
    "performance: throughput and latency floors; slower than the rest of the suite.",
]

[tool.coverage.run]
source = ["src/network_defender"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

# Mutation testing — a spot check, not a gate. Scoped to the detector
# implementations because that is where a silently-weakened test is most
# expensive: a detector that stops detecting still passes every assertion
# about the alerts it does raise. See docs/TESTING.md for how to read the
# results and scripts/mutation_spot_check.sh for the invocation.
[tool.mutmut]
source_paths = ["src/network_defender"]
only_mutate = ["src/network_defender/detectors/*"]
pytest_add_cli_args_test_selection = ["tests/unit/detectors", "tests/e2e"]
# The suite-wide coverage gate would fail every run of this subset, which
# mutmut would read as "every mutant killed" — the most flattering possible
# wrong answer.
pytest_add_cli_args = ["--no-cov"]
also_copy = ["config", "rules", "scripts", "migrations", "alembic.ini"]
do_not_mutate = ["*/__init__.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/network_defender"]
# PEP 561 marker: without it, consumers (and mypy runs that do not name src/
# explicitly) silently fall back to treating this package as untyped.
artifacts = ["src/network_defender/py.typed"]


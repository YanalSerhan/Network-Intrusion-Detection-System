name: SYN Flood
severity: high
enabled: true
# A flood is a volume event, which is why this one counts matches rather than
# distinct values: fire after 100 unacknowledged SYNs to the same destination
# within 10 seconds. Without the threshold this rule matched every single SYN
# packet, so any ordinary connection raised a high-severity alert.
window: 10
threshold: 100
group_by: dst_ip
conditions:
  - field: protocol
    operator: equals
    value: tcp
  - field: tcp_flags.syn
    operator: equals
    value: true
  - field: tcp_flags.ack
    operator: equals
    value: false

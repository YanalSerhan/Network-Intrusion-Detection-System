# Alembic configuration.
#
# The database URL is deliberately NOT set here: migrations/env.py resolves it
# from config/setup.json and the DATABASE_URL environment variable, so there is
# exactly one source of truth and no credentials in a tracked file.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC

# Newly generated migrations are auto-formatted before anyone sees them.
# Alembic's template does not respect this project's line length or import
# order, so every generated revision arrived with lint violations that had to
# be cleaned by hand — or, more often, were committed and left.
[post_write_hooks]
hooks = ruff_fix
ruff_fix.type = exec
ruff_fix.executable = uv
ruff_fix.options = run ruff check --fix --quiet REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

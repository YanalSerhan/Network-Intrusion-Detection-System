<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Network Defender — network intrusion detection dashboard" />
    <meta name="color-scheme" content="dark light" />
    <title>Network Defender</title>
    <script>
      // Applied before first paint: reading the stored theme in React would
      // render the default theme first, producing a flash of the wrong colours
      // on every page load.
      (function () {
        try {
          var stored = localStorage.getItem("nd-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = stored || (prefersDark ? "dark" : "light");
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      The Network Defender dashboard requires JavaScript. The REST API at
      <code>/api/v1</code> remains available without it.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

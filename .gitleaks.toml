# gitleaks configuration for Network Defender.
#
# Starts from the upstream rule set rather than replacing it — a hand-rolled
# list of patterns is a list of the leaks someone thought of.
#
# Everything below is an allowlist, and each entry says why it is safe. An
# unexplained allowlist entry is how a real finding gets silenced by someone
# who assumed a predecessor had checked.

[extend]
useDefault = true

[allowlist]
description = "Placeholders, fixtures and documentation that are not credentials"

paths = [
  # Placeholder values, by definition: the file exists to show the shape of a
  # secret without being one. tests/unit/security asserts it stays in step
  # with what the code reads.
  '''^\.env-example$''',
  # Synthetic captures. Generated by scripts/pcap_scenarios from a fixed seed;
  # the "high entropy" in them is DNS tunnelling payload, which is the point.
  '''^tests/data/pcaps/.*\.pcap$''',
  # Documentation showing what a configuration line looks like.
  '''^docs/CONFIGURATION\.md$''',
  '''^docs/THREAT_MODEL\.md$''',
  # The redaction tests. They contain credential-shaped strings because that
  # is the input: each one asserts the logging filter rewrites it before it
  # reaches a log line. Flagging them would mean the only way to stop the
  # scanner complaining is to stop testing that secrets get redacted.
  #
  # Both paths are listed because history is scanned and the suite moved in
  # Milestone 14 — an allowlist that only knows the current layout goes blind
  # on every commit before the move.
  '''^tests/unit/observability/test_redaction\.py$''',
  '''^tests/observability/test_logging\.py$''',
]

regexes = [
  # The names of environment variables, which is what the constants module
  # holds so the values never appear in source.
  '''ABUSEIPDB_API_KEY''',
  '''your-abuseipdb-key''',
  '''your-secret-api-key-here''',
]
